# Tests bei jedem Push und Pull Request: Python (pytest), JavaScript (node --test), Abhängigkeitsprüfung.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
      - name: JavaScript-Tests
        run: node --test tests/js/*.test.mjs
      - name: README passt zum Stand
        run: python tools/update_readme.py --check
      - name: Keine Daten, Kacheln oder Geheimnisse im Repository
        run: |
          # Einzige Ausnahme: die mitgelieferte Weltkarte (Zoom 0 bis 5) als Hintergrund der Desktop-App, siehe web/basis/README.txt
          bad=$(git ls-files | grep -v '^web/basis/welt\.pmtiles$' | grep -E '(^data/|\.sqlite|\.pmtiles$|(^|/)\.env$)' || true)
          [ -z "$bad" ] || { echo "Nicht ins Repository:"; echo "$bad"; exit 1; }
          big=$(git ls-files -z | xargs -0 du -k | awk '$1>5120{print}' | grep -v -e 'web/vendor/' -e 'web/basis/welt\.pmtiles' || true)
          [ -z "$big" ] || { echo "Datei über 5 MB:"; echo "$big"; exit 1; }
  layout:
    # Layouttest im Browser (Überlappung, Fensterrand, freie Kartenmitte, Vollbild); eigener Job, damit ein Browserproblem die Testläufe oben nicht färbt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements.txt
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
      - run: npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Layouttest
        run: node --test tests/e2e/layout.e2e.mjs
        env: { PLAYWRIGHT_MODULE: "${{ runner.temp }}/pw/node_modules/playwright" }
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt
  audit-desktop:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Es gibt kein eingechecktes package-lock.json (Desktop-Bau läuft lokal): Sperrdatei nur für die Prüfung erzeugen
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high
