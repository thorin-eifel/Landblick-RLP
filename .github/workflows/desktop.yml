# Baut die Desktop-App auf je einem Runner pro Betriebssystem (kein Cross-Build möglich: Sidecar und WebView sind plattformgebunden).
name: desktop
on: { workflow_dispatch: {}, push: { tags: ["desktop-v*"] } }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-22.04] }   # Windows: windows-installer.yml (PowerShell statt bash)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux-Bibliotheken
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rsync
      - name: Sidecar
        shell: bash
        run: desktop/build-sidecar.sh
      - name: Platzhalter für die Kachelpakete
        # tauri.conf.json verlangt den Ressourcenordner pakete/; er liegt nicht im Git (gitignore). Ohne Pakete sucht die App im Datenordner.
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/pakete
          echo 'Platzhalter: Kachelpakete liegen nicht im Repository.' > desktop/src-tauri/pakete/LIESMICH.txt
      - name: App
        shell: bash
        run: cd desktop && npm install --include=dev && npx tauri build
      - uses: actions/upload-artifact@v5
        with: { name: "app-${{ matrix.os }}", path: desktop/src-tauri/target/release/bundle/** }
